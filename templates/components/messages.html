{% if messages %}
  <ul class="messages-list" role="status" aria-live="polite">
    {% for message in messages %}
      <li class="alert alert-{{ message.tags }}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.75rem;">
          <div style="display:flex; align-items:flex-start; gap:0.5rem;">
            <span aria-hidden="true" style="font-size:1.1rem; line-height:1.3;">
              {% if message.tags == 'success' %}✅
              {% elif message.tags == 'error' or message.tags == 'danger' %}⛔
              {% elif message.tags == 'warning' %}⚠️
              {% else %}ℹ️{% endif %}
            </span>
            <span>{{ message }}</span>
          </div>
          <button type="button" class="alert-close-btn" aria-label="Close notification" onclick="this.closest('.alert').remove();" style="background:transparent; border:none; cursor:pointer; font-size:1.3rem; line-height:1; color:inherit; opacity:0.65; padding:0 0.2rem;">&times;</button>
        </div>
      </li>
    {% endfor %}
  </ul>
{% endif %}
